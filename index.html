<!doctype html><html lang="en"><head><title>Raise &amp; Brokering Tracker</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#050505;--panel:#ffffff;--card:#ffffff;--card2:#111111;--line:#d1d5db;--gold:#1c1708;--gold2:#2a220b;--golddk:#1c1708;--txt:#f5f5f5;--muted:#6b7280;--red:#b91c1c;--green:#15803d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:14px}
a{color:var(--gold)}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:10;background:#ffffff;border-bottom:1px solid var(--line);padding:18px 0 12px}

h1,h2,h3{font-family:Oswald,Inter,sans-serif;letter-spacing:.04em;margin:0}

.pills button:hover{border-color:var(--golddk);color:var(--gold)}
.pills button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
main{padding:22px 20px 40px}
.sec{margin:26px 0 10px}
.sec .eyebrow{font:700 11px Inter;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.sec h2{font-size:22px;margin-top:2px}
.sub{color:var(--muted);margin:4px 0 0}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:linear-gradient(160deg,var(--card) 0%,var(--panel) 100%);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.kpi .l{font:700 11px Inter;letter-spacing:.12em;color:var(--muted)}
.kpi .v{font:700 26px Oswald;color:var(--gold);margin:6px 0 4px}
.kpi .c{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;overflow:hidden}
.panel h3{font-size:16px;color:var(--gold);margin-bottom:10px}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);max-height:72vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#1c1708;color:#fff;font:700 11px Inter;letter-spacing:.1em;text-align:left;padding:10px;border-bottom:1px solid var(--golddk);white-space:nowrap;cursor:pointer;user-select:none}

tr:hover td{background:#050505}

.b-gold{background:#221c0a;color:var(--gold);border-color:#e8b923}
.b-green{background:#22c55e1f;color:#15803d;border-color:#22c55e55}
.b-red{background:#e11d2e1f;color:#b91c1c;border-color:#e11d2e55}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}

.count{color:var(--muted);font-size:12px}
.lb{display:flex;flex-direction:column;gap:6px}
.lbrow{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--card)}
.lbrow .rk{font:700 16px Oswald;color:var(--gold);text-align:center}
.lbrow .nm{font-weight:700}

.bars{display:flex;flex-direction:column;gap:8px}

.notes dl{display:grid;grid-template-columns:160px 1fr;gap:10px 18px;margin:0}

.notes dd{margin:0;color:var(--txt);line-height:1.5}
.foot{padding:20px 20px 40px;font-size:12px;border-top:1px solid var(--line)}
.callout{background:#1a160a;border:1px solid #f5d76e;border-radius:12px;padding:10px 14px;color:var(--txt);margin:8px 0}
td:first-child{white-space:nowrap;font-weight:600}
td.wrapc{min-width:340px;max-width:520px;line-height:1.4}
.tblwrap{scrollbar-color:#9ca3af #050505}

th.sortable{cursor:pointer;user-select:none}

.inv-link tbody td:first-child{cursor:pointer;color:var(--gold);text-decoration:underline;text-decoration-color:#e8b923;text-underline-offset:3px}

.income-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}

.income-panel{padding:0;overflow:hidden}
.income-panel .panel-head{padding:14px 16px 10px;color:#fff}

.income-panel .income-tbl{margin:0;border:none;border-radius:0}

.income-panel > .income-tbl, .income-panel > .bars, .income-panel > .sub{padding-left:16px;padding-right:16px}

.income-panel > .bars{padding-bottom:8px}
.raise-fill{background:linear-gradient(90deg,#1c1708,#241d09)!important}

.track.stacked{display:flex;background:#262626}

.legend{display:flex;gap:18px;align-items:center;margin:10px 0 0;color:var(--muted);font-size:12px}

.grand-total{margin:8px 0 16px;padding:18px 20px;text-align:center;background:linear-gradient(135deg,#f5f5f5,#1c1708);border:none;color:#fff}
.grand-total .eyebrow{font:700 10px Inter;letter-spacing:.16em;text-transform:uppercase;color:#e8b923}
.grand-total .grand-label{font:700 13px Inter;letter-spacing:.12em;color:#f5d76e;margin:4px 0 2px}

@media (prefers-reduced-motion: reduce){
  .grand-total .grand-value,.hero .hv{transition:none}
}

.grand-split{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 16px}
@media(max-width:1100px){.grand-split{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grand-split{grid-template-columns:1fr}}
.grand-card{border-radius:16px;padding:16px 18px;color:#fff}
.grand-card.cash{background:linear-gradient(135deg,#1c1708,#241d09)}
.grand-card.bshare{background:linear-gradient(135deg,#475569,#a3a3a3)}
.grand-card.all{background:linear-gradient(135deg,#f5f5f5,#0f172a)}
.grand-card .eyebrow{font:700 10px Inter;letter-spacing:.14em;text-transform:uppercase;color:#f5d76e}
.grand-card.bshare .eyebrow{color:#262626}
.grand-card .grand-label{font:700 12px Inter;letter-spacing:.1em;margin:4px 0 2px;color:#221c0a}
.grand-card .grand-value{font:700 32px Oswald,Inter,sans-serif;letter-spacing:.02em}
.hero-kpis.twin{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid rgba(255,255,255,.22);padding-top:12px;margin-top:12px}

.hero-block{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.hero-block .hb-title{font:700 10px Inter;letter-spacing:.12em;color:#f5d76e;margin-bottom:8px}
.hero-block.bvg .hb-title{color:#262626}
.hero-block .hb-note{font:600 10px Inter;color:#2a2a2a;margin-top:6px}
.bshare-fill{background:linear-gradient(90deg,#a3a3a3,#94a3b8)!important}
.legend .bshare-lg{background:#a3a3a3}

/* Brokered RE warning rows */
tr.row-warn td{background:#3a2f0e!important}
tr.row-warn-soft td{background:#2a220b!important}
.badge.b-warn{background:#F59E0B;color:#111}
.badge.b-amber{background:#FDE68A;color:#f5d76e}
.brokered-heroes{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.brokered-heroes{grid-template-columns:1fr 1fr}}
.brokered-heroes .grand-value{font-size:26px}
.th.sortable, th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--gold,#2a220b)}

.grand-card.brok{background:linear-gradient(135deg,#2a220b,#3a2f0e)}


.income-panel .panel-head h3{font:700 32px Oswald,Inter,sans-serif;letter-spacing:.02em;line-height:1.15;overflow-wrap:anywhere}
.income-panel h3 .h3-total{color:#fff !important;font-size:1em;font-weight:inherit;margin-left:0;display:inline}

:root{--bg:#050505;--panel:#141414;--card:#1c1c1c;--card2:#111;--line:#2a2a2a;--gold:#e8b923;--gold2:#f5c518;--golddk:#b8901a;--txt:#f5f5f5;--muted:#a3a3a3;--red:#ff2d3a;--green:#22c55e}

.pills button{background:#1c1c1c;color:#d4d4d4;border-color:#2a2a2a}.pills button.on{background:linear-gradient(180deg,#f5c518,#e8b923);color:#050505;border-color:#e8b923;box-shadow:0 0 14px #e8b92399}
table{background:#141414;color:#f5f5f5}th{background:#0c0c0c!important;color:#e8b923!important;border-bottom:1px solid #e8b923}td{border-color:#202020!important}
tr:nth-child(even) td{background:#0c0c0c66}tr:hover td{background:#e8b92314}input,select{background:#0c0c0c;color:#f5f5f5;border:1px solid #2a2a2a}
.panel,.kpi{background:linear-gradient(180deg,#1c1c1c,#141414)!important;border-color:#2a2a2a!important}.row-warn td{background:#3a2a0a66!important}
.grand-card.bshare,.bshare-fill{background:linear-gradient(135deg,#262626,#3a3a3a)!important}.grand-card.all,.grand-total{background:linear-gradient(135deg,#2a220b,#0a0a0a)!important;border:1px solid #e8b92366!important}
.grand-card *,.income-panel p,.income-panel .sub,.income-panel .hb-note,.hero-block *{color:#d4d4d4!important}.grand-card .eyebrow,.income-panel .eyebrow,.hero-block .eyebrow,.hero-block [class*=lab]{color:#e8b923!important}.grand-card [data-count],.hero-block [data-count],.income-panel h3{color:#f5f5f5!important}

<div id="gate"><form onsubmit="event.preventDefault();unlock()"><h1 style="color:#e8b923">Raise &amp; Brokering Tracker</h1><p class="muted">Enter password</p><input id="pw" type="password" autofocus><button>Open</button><div id="err" class="neg"></div></form></div>
<header class="top"><div class="wrap"><h1 id="title">RAISE &amp; BROKERING TRACKER</h1><p id="subtitle" class="muted"></p><div class="pills" id="top" style="margin-top:12px"><button data-t="All">All</button><button data-t="E">Elevate Raise</button><button data-t="B">BVG Raise</button><button data-t="K">Brokering</button></div><nav id="nav" class="pills" style="margin-top:8px"></nav></div></header><main class="wrap" id="app"></main><footer class="wrap foot muted" id="foot"></footer>
<script id="crmapp" type="text/plain">(function(){(function(){
const D = window.CRM, S = D.sheets;
const TABS = window.CRM_TABS;
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (v,dec) => (v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0});
const fmtMoney = v => money(v, Math.round(v)!==v);
const moneyOrDash = v => (v==null||v===''||v===0||(typeof v==='number'&&!Number.isFinite(v))) ? '—' : fmtMoney(v);
/** Count-up like Shep's site: easeOutCubic 1-(1-t)^3 via rAF. Default 1200ms (Shep KPIs use ~3s; panel heroes stay snappy). */
function prefersReducedMotion(){ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function countUp(el, target, {duration=1200, decimals=false, prefix='$'}={}){
  if(!el) return;
  const end = Number(target)||0;
  const fmt = v => {
    if(prefix==='$') return money(v, decimals || Math.round(v)!==v);
    return String(Math.round(v));
  };
  if(prefersReducedMotion() || end===0){ el.textContent = fmt(end); return; }
  const t0 = performance.now();
  const ease = t => 1 - Math.pow(1-t, 3);
  const tick = now => {
    const p = Math.min(1, (now-t0)/duration);
    el.textContent = fmt(end * ease(p));
    if(p<1) requestAnimationFrame(tick); else el.textContent = fmt(end);
  };
  el.textContent = fmt(0);
  requestAnimationFrame(tick);
}

const pct = v => (v*100).toLocaleString('en-US',{maximumFractionDigits:2})+'%';
const isPct = h => /RATE|COMM\. %|MARGIN|VS BEST/.test(h);
const isMoney = h => /\$|RAISE|COMMISSION|AMOUNT|INCOME|GAP|BASIS|DIFFERENCE|SHEP SHEET|SCREENSHOT|^20\d\d$|TOTAL RAISED|LIFETIME|INVESTED|SALE PRICE|VOLUME|PRICE/.test(h) && !/YEAR|YR|TAB NAME|NOTE|STATUS|COMMENT|OFFERING\(S\)|PROPERTY TYPE|CONFIDENCE/.test(h);
function fmt(h, v){
  if(v===null||v===undefined||v==='') return '';
  if(typeof v==='number'){ if(isPct(h)) return pct(v); if(isMoney(h)) return fmtMoney(v); return String(v); }
  return esc(v);
}
function badge(v){
  const s=String(v), l=s.toLowerCase();
  let c='b-gray';
  if(/active|committed|credited|closed|brokering|high|sell/.test(l)) c='b-gold';
  if(/past investor|transacted|open|buy|medium/.test(l)) c='b-green';
  if(/not interested|duplicate|low|lease/.test(l)) c='b-red';
  if(l==='low') c='b-warn';
  if(l==='medium') c='b-amber';
  if(l==='high') c='b-green';
  return `<span class="badge ${c}">${esc(s)}</span>`;
}
const BADGE_COLS = /^(STATUS|STAGE|OUTCOME|TYPE|PROGRAM|PROGRAMS|SYNDICATOR|SYNDICATORS|CONFIDENCE|CLIENT SIDE)$/;
const WIDE_COLS = /NOTE|COMMENT|DETAIL|NEXT STEP|FLAG/;
function tables(name){ return S[name].filter(b=>b.type==='table'); }
function titles(name){ return S[name].filter(b=>b.type==='title').map(b=>b.text); }

function renderTable(t, opts={}){
  const totalIdx = t.rows.findIndex(r=>/^total/i.test(String(r[0]))||/^Total /.test(String(r[0])));
  let body = t.rows.slice(); let total=null;
  if(opts.splitTotal && totalIdx>=0 && totalIdx===t.rows.length-1){ total=body.pop(); }
  const wrap=$(`<div></div>`);
  let state={q:'',f:'',sort:null,dir:1};
  let filterCol = opts.filterCol!=null ? t.header.indexOf(opts.filterCol) : -1;
  if(opts.search){
    const tb=$(`<div class="toolbar"><input type="search" placeholder="Search ${esc(opts.search)}…"></div>`);
    if(filterCol>=0){
      const vals=[...new Set(body.map(r=>r[filterCol]).filter(v=>v!=null))];
      const sel=$(`<select><option value="">All ${esc(t.header[filterCol].toLowerCase())}</option>${vals.map(v=>`<option>${esc(v)}</option>`).join('')}</select>`);
      sel.onchange=()=>{state.f=sel.value;draw();}; tb.appendChild(sel);
    }
    const cnt=$(`<span class="count"></span>`); tb.appendChild(cnt);
    tb.querySelector('input').oninput=e=>{state.q=e.target.value.toLowerCase();draw();};
    wrap.appendChild(tb); wrap._cnt=cnt;
  }
  const tw=$(`<div class="tblwrap"><table><thead></thead><tbody></tbody><tfoot></tfoot></table></div>`);
  if(opts.noMax) tw.style.maxHeight='none';
  wrap.appendChild(tw);
  const thead=tw.querySelector('thead'), tbody=tw.querySelector('tbody'), tfoot=tw.querySelector('tfoot');
  const numCol = t.header.map((h,i)=>body.some(r=>typeof r[i]==='number') && !body.some(r=>typeof r[i]==='string' && r[i]!==''));
  const tr=document.createElement('tr');
  function headHtml(){
    const tr=document.createElement('tr');
    t.header.forEach((h,i)=>{
      const arrow = state.sort===i ? (state.dir>0?' \u25B2':' \u25BC') : '';
      const th=$(`<th class="sortable ${numCol[i]?'num':''}" title="Sort">${esc(h)}${arrow}</th>`);
      th.onclick=()=>{state.dir=state.sort===i?-state.dir:1;state.sort=i;draw();};
      tr.appendChild(th);
    });
    return tr;
  }
  thead.appendChild(headHtml());
  const rowHtml=(r,cls='')=>{ const extra=(typeof opts.rowClass==='function'?opts.rowClass(r):'')||''; return `<tr class="${cls} ${extra}">${r.map((v,i)=>{const h=t.header[i];
    const inner = (BADGE_COLS.test(h)&&v&&!cls)? badge(v) : fmt(h,v);
    return `<td class="${numCol[i]?'num':''} ${(opts.wide||WIDE_COLS).test(h)?'wrapc':''}">${inner}</td>`;}).join('')}</tr>`; };
  const sortKey=v=>{
    if(v==null||v==='') return null;
    if(typeof v==='number') return v;
    if(typeof v==='string'){
      const n=Number(String(v).replace(/[$,]/g,'').replace(/\((.*)\)/,'-$1'));
      if(!Number.isNaN(n) && /[\d]/.test(v) && /^[\s$(),.\-\d%]+$/.test(v)) return n;
      return v.toLowerCase();
    }
    return v;
  };
  function draw(){
    let rows=body.filter(r=>(!state.q||r.join(' ').toLowerCase().includes(state.q))&&(!state.f||String(r[filterCol])===state.f));
    if(state.sort!=null){
      const i=state.sort;
      rows=rows.slice().sort((a,b)=>{
        const x=sortKey(a[i]), y=sortKey(b[i]);

        return String(x).localeCompare(String(y),undefined,{numeric:true,sensitivity:'base'})*state.dir;
      });
    }
    thead.innerHTML=''; thead.appendChild(headHtml());
    tbody.innerHTML=rows.map(r=>rowHtml(r, (!opts.splitTotal && /^total/i.test(String(r[0])))?'total':'')).join('');

}

function filt(full,t){const d=JSON.parse(JSON.stringify(full));if(t==='All')return d;const rx=RX[t];
 for(const [name,blocks] of Object.entries(d.sheets)){if(!TV[t].includes(name)){continue;}
  d.sheets[name]=blocks.filter(b=>{if(b.type!=='table')return true;const H=b.header.map(h=>String(h||''));
   const sc=H.findIndex(h=>/^(SYNDICATOR|PROGRAMS|PROGRAM \/ SPONSOR|SYNDICATORS)$/.test(h));
   if(sc<0&&name==='Deals'){}
   if(sc>=0){b.rows=b.rows.filter(r=>rx.test(String(r[sc]||''))||(name==='Deals'&&t==='K'&&/brokering|transaction/i.test(String(r[2]||''))));return b.rows.length>0;}
   if(name==='Commissions'){const isB=H.includes('COUNTERPARTY');if(t==='K')return isB;if(t==='E')return !isB&&!/TOTALS/.test(H[0]);return false;}
   if(name==='Raise Income'&&H[0]==='OFFERING')return t==='E';
   const keep=H.map((h,i)=>i===0||!XC[t].test(h));const mon=H.map((h,i)=>keep[i]&&/\$|COMM/.test(h));
   if(!mon.some(Boolean))return true;
   b.header=b.header.filter((_,i)=>keep[i]);b.rows=b.rows.filter(r=>/total/i.test(String(r[0]))||r.some((c,i)=>mon[i]&&c));b.rows=b.rows.map(r=>r.filter((_,i)=>keep[i]));delete b.cols;return b.rows.length>0;});}
 return d;}
let FULL;function tab(t){if(!TV[t])t='All';localStorage.rbtab=t;document.querySelectorAll('#top button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 window.CRM=filt(FULL,t);window.CRM_TABS=TV[t];document.getElementById('nav').innerHTML='';document.getElementById('app').innerHTML='';
 const cur=decodeURIComponent(location.hash.slice(1)).split('::')[0];if(!TV[t].includes(cur))history.replaceState(null,'','#'+encodeURIComponent(TV[t][0]));
 const s=document.createElement('script');s.textContent=document.getElementById('crmapp').textContent;document.body.appendChild(s);s.remove();}
document.addEventListener('click',e=>{const b=e.target.closest('#top button');if(b)tab(b.dataset.t)});
async function unlock(){const pw=document.getElementById('pw').value;try{
const e=await (await fetch('crm.enc.json',{cache:'no-store'})).json();const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
FULL=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.iv)},key,b(e.ct))));
document.getElementById('gate').remove();tab(localStorage.rbtab||'All');}catch(x){document.getElementById('err').textContent='Wrong password';}}
</script><!--SORTABLE-START--><script>
/* Shared sortable tables (Grok Bot trackers). Click any header: asc/desc toggle with ▲/▼.
   Works on dynamically rendered tables via event delegation. Totals (tfoot, .total/.ft/.tot rows,
   or first cell TOTAL/ALL-TIME/GRAND) stay pinned at bottom. Group-label rows (fewer cells / colspan)
   keep their members: sorting happens within each group. Uses td[data-v] when present.
   Skip: th with own onclick, th.nosort, or table[data-nosort]. */
(function(){
  if(window.__sortableShared)return;window.__sortableShared=1;
  var st=document.createElement('style');
  st.textContent='table:not([data-nosort]) th:not(.nosort){cursor:pointer;user-select:none}th .srt-ar{font-size:.8em;opacity:.85;margin-left:3px}';
  (document.head||document.documentElement).appendChild(st);
  var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function key(cell){
    if(!cell)return null;
    var raw=cell.dataset&&cell.dataset.v!=null?cell.dataset.v:cell.textContent;
    var s=String(raw).replace(/[▲▼]/g,'').trim();
    if(!s||s==='—'||s==='-'||s==='–'||/^n\/?a$/i.test(s))return null;
    var m;
    if((m=s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/)))return {n:Date.UTC(+m[1],+m[2]-1,+(m[3]||1))};
    if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){var y=+m[3];if(y<100)y+=2000;return {n:Date.UTC(y,+m[1]-1,+m[2])};}
    if((m=s.match(/^([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[3],MON[m[1].toLowerCase()]-1,+m[2])};
    if((m=s.match(/^([A-Za-z]{3})[a-z]* (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[2],MON[m[1].toLowerCase()]-1,1)};
    if((m=s.match(/^Q([1-4]) (\d{4})$/i)))return {n:Date.UTC(+m[2],(+m[1]-1)*3,1)};
    var t=s.replace(/[$,%x×\s]|USD/gi,'').replace(/^\+/,'').replace(/[−–]/g,'-');
    var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
    var mult=1;if((m=t.match(/^(-?[\d.]+)([KMB])$/i))){t=m[1];mult={k:1e3,m:1e6,b:1e9}[m[2].toLowerCase()];}
    if(/^-?\d*\.?\d+$/.test(t))return {n:parseFloat(t)*mult*(neg?-1:1)};
    return {s:s.toLowerCase()};
  }
  function pinned(r){
    if(r.parentElement&&r.parentElement.tagName==='TFOOT')return true;
    if(/(^|\s)(total|totals|ft|tot|sum|grand|pinned)(\s|$)/i.test(r.className))return true;
    var c=r.cells[0];return !!c&&/^\s*(TOTAL|TOTALS|ALL-TIME|GRAND TOTAL)\b/i.test(c.textContent);
  }
  document.addEventListener('click',function(e){
    var th=e.target.closest&&e.target.closest('th');if(!th||th.onclick||th.classList.contains('nosort'))return;
    var tb=th.closest('table');if(!tb||tb.hasAttribute('data-nosort'))return;
    var hr=th.parentElement;if(hr.parentElement.tagName==='TFOOT')return;
    var ci=0;for(var k=0;k<hr.cells.length&&hr.cells[k]!==th;k++)ci+=hr.cells[k].colSpan||1;
    var ncol=0;for(k=0;k<hr.cells.length;k++)ncol+=hr.cells[k].colSpan||1;
    var dir=th.dataset.sdir==='asc'?'desc':'asc',m=dir==='asc'?1:-1;
    tb.querySelectorAll('th').forEach(function(x){delete x.dataset.sdir;var a=x.querySelector('.srt-ar');if(a)a.remove();});
    th.dataset.sdir=dir;var ar=document.createElement('span');ar.className='srt-ar';ar.textContent=dir==='asc'?'▲':'▼';th.appendChild(ar);
    var bodies=tb.tBodies.length?[].slice.call(tb.tBodies):[tb];
    bodies.forEach(function(body){
      var all=[].slice.call(body.rows).filter(function(r){return r!==hr&&!(r.cells.length&&r.cells[0].tagName==='TH'&&!r.querySelector('td'));});
      var pins=[],groups=[{head:null,rows:[]}];
      all.forEach(function(r){
        if(pinned(r)){pins.push(r);return;}
        var w=0;for(var j=0;j<r.cells.length;j++)w+=r.cells[j].colSpan||1;
        if(r.cells.length===1&&ncol>1)groups.push({head:r,rows:[]});else groups[groups.length-1].rows.push(r);
      });
      function cellAt(r){var x=0;for(var j=0;j<r.cells.length;j++){if(x===ci)return r.cells[j];x+=r.cells[j].colSpan||1;}return null;}
      groups.forEach(function(g){
        g.rows.sort(function(a,b){var A=key(cellAt(a)),B=key(cellAt(b));
          if(!A&&!B)return 0;if(!A)return 1;if(!B)return -1;
          if(A.n!=null&&B.n!=null)return (A.n-B.n)*m;
          return String(A.s!=null?A.s:A.n).localeCompare(String(B.s!=null?B.s:B.n),undefined,{numeric:true})*m;});
        if(g.head)body.appendChild(g.head);g.rows.forEach(function(r){body.appendChild(r);});
      });
      pins.forEach(function(r){body.appendChild(r);});
    });
  },false);
})();

</script><!--SORTABLE-END-->
